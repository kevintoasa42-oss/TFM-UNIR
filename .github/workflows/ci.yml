# CI del frontend en GitHub Actions: mismas etapas que el Jenkinsfile.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_NAME: flashreto-frontend
  BACKEND_CONTEXT: ${{ github.workspace }}/backend

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/TFM-BACK-END
          ref: main
          path: backend

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Instalar dependencias
        run: |
          npm ci --no-audit --no-fund
          npm ci --no-audit --no-fund --prefix "$BACKEND_CONTEXT"

      - name: Pruebas unitarias
        run: npm test

      - name: Compilar
        run: npm run build

      - name: Imagen Docker
        run: docker build --tag "$IMAGE_NAME:${GITHUB_SHA::7}" .

      # Levanta frontend, backend y PostgreSQL, prueba la API y dos clientes WebSocket a través
      # de Nginx, recrea los contenedores y comprueba la persistencia. Al terminar los elimina.
      - name: Sistema completo con Docker Compose
        run: |
          printf 'POSTGRES_PASSWORD=%s\nPOSTGRES_PORT=0\nBACKEND_PORT=0\n' "$(openssl rand -hex 32)" > "$BACKEND_CONTEXT/.env.docker"
          npm run test:system

  publish:
    needs: ci
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Sin credenciales de Docker Hub
        if: env.DOCKERHUB_USERNAME == '' || env.DOCKERHUB_TOKEN == ''
        run: echo "Define los secretos DOCKERHUB_USERNAME y DOCKERHUB_TOKEN para publicar; se omite la publicación."

      - uses: docker/login-action@v3
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Publicar en Docker Hub
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        run: |
          repository="$DOCKERHUB_USERNAME/$IMAGE_NAME"
          tags=(--tag "$repository:${GITHUB_SHA::7}")
          # Un reintento de un commit antiguo no debe mover latest hacia atrás.
          if [ "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA" ]; then
            tags+=(--tag "$repository:latest")
          else
            echo "main ya avanzó: se publica solo ${GITHUB_SHA::7}, sin mover latest."
          fi
          docker build "${tags[@]}" .
          docker push --all-tags "$repository"
