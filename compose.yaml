name: flashreto-local
services:
  db:
    image: postgres:18-bookworm@sha256:3725f4e2499eef5134592b3b4ab79a543ed7f8e533b05b5b637af926630f6650
    environment:
      POSTGRES_DB: flashreto
      POSTGRES_USER: flashreto
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Ejecuta bash iniciar.sh para generar .env.docker}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flashreto -d flashreto"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  web:
    build: .
    environment:
      DATABASE_URL: postgresql://flashreto:${POSTGRES_PASSWORD}@db:5432/flashreto
      PORT: 3000
    ports:
      - "${FLASHRETO_BIND:-127.0.0.1}:${FLASHRETO_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped
volumes:
  postgres-data:
