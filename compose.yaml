name: flashreto-local
include:
  - path: ${BACKEND_CONTEXT:-../TFM-BACK-END}/compose.yaml
    env_file: ${BACKEND_CONTEXT:-../TFM-BACK-END}/.env.docker
services:
  frontend:
    build: .
    environment:
      API_UPSTREAM: ${API_UPSTREAM:-http://backend:4000}
    ports:
      - "${FLASHRETO_BIND:-127.0.0.1}:${FLASHRETO_PORT:-3000}:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
